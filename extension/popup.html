<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CordiaClassroom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="brand">
    <img src="cordia-classroom-logo.png" alt="">
    <div><strong>CordiaClassroom</strong><span>Turn the current page into a study guide.</span></div>
  </header>

  <section id="status" class="status-card" role="status">
    <span class="status-dot" aria-hidden="true"></span>
    <span id="status-text">Checking your Classroom connection…</span>
    <a id="connect" href="https://classroom.cordiaai.io" target="_blank" hidden>Connect</a>
  </section>

  <main class="card workflow" aria-label="Study guide workflow">
    <div class="steps" aria-label="Progress">
      <div class="step" data-step="capture"><b>1</b><span>Capture</span></div>
      <div class="step" data-step="scrape"><b>2</b><span>Read</span></div>
      <div class="step" data-step="extract"><b>3</b><span>Focus</span></div>
      <div class="step" data-step="create"><b>4</b><span>Create</span></div>
    </div>
    <button id="make-guide" class="make-button" disabled>Make study guide</button>
  </main>

  <section class="card tutor-card" aria-labelledby="tutor-title">
    <div class="tutor-heading">
      <div><small>ASK ABOUT THIS PAGE</small><strong id="tutor-title">Cordia Tutor</strong></div>
      <div class="tutor-actions">
        <button id="tutor-new" class="tutor-new" type="button">New chat</button>
        <button id="tutor-size" class="tutor-size" type="button" aria-pressed="false">Maximize chat</button>
      </div>
    </div>
    <div id="tutor-messages" class="tutor-messages" aria-live="polite">
      <p class="tutor-empty">Ask for an explanation, example, or quick check.</p>
    </div>
    <form id="tutor-form" class="tutor-form">
      <input id="tutor-input" type="text" disabled maxlength="2000" autocomplete="off" placeholder="Ask Cordia about this page" aria-label="Ask Cordia about this page">
      <button id="tutor-send" type="submit" disabled aria-label="Send question">↑</button>
    </form>
  </section>

  <section id="result" class="card result" hidden>
    <strong id="result-title"></strong>
    <pre id="result-content"></pre>
  </section>

  <section id="save-bubble" class="save-bubble" hidden>
    <span class="live-dot" aria-hidden="true"></span>
    <div><small>Ready for Classroom</small><strong id="guide-title"></strong></div>
    <button id="save-guide">Save to Classroom</button>
  </section>
  <script src="tutor-chat.js"></script>
  <script src="popup.js"></script>
</body>
</html>
