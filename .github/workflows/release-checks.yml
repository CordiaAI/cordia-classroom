name: Classroom release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: pip install -r backend/requirements.txt pyflakes
      # Unused imports and names shadowed by later definitions (a route once replaced the OpenAI helper it shared a name with).
      - run: python -m pyflakes backend
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix web
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: npm run build --prefix web

  # Connected-app (OAuth) tokens get nothing from the database, Storage, Realtime or Supabase
  # Auth: boots a throwaway local Supabase stack in Docker and runs tests/oauth/probe.mjs.
  oauth-lockdown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: bash tests/oauth/run_local_probe.sh
